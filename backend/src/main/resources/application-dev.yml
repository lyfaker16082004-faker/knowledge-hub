spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/knowledge_hub?serverTimezone=Asia/Bangkok&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        characterEncoding: UTF-8
        connectionCollation: utf8mb4_unicode_ci
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false